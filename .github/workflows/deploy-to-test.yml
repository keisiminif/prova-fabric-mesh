name: Deploy Fabric to TEST

on:
  push:
    branches:
      - main 

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Sostituisci i GUID (Deployment Rules)
        run: |
          # Escludiamo esplicitamente la cartella .github per evitare blocchi di sicurezza
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/9d151055-5883-45ed-970b-7b6628cf14ce/ca209b34-9112-4faf-a25e-3ccea1b76680/g' {} +
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/fccbab2d-4470-4913-bfe2-969b7c966c01/08c3e674-5bf6-4941-8a80-b4d3149230c2/g' {} +

      - name: Crea e pusha il ramo di test (test-release)
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git checkout -b test-release
          git add .
          git commit -m "Auto-inject GUID per TEST" || echo "Nessuna modifica"
          git push -f origin test-release
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Login su Azure via CLI
        run: az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }} --allow-no-subscriptions

      - name: Deploy su Fabric via REST API
        env:
          WORKSPACE_ID: "ca209b34-9112-4faf-a25e-3ccea1b76680" 
        run: |
          TOKEN=$(az account get-access-token --resource "https://api.fabric.microsoft.com/" --query accessToken -o tsv)
          
          curl -X POST "https://api.fabric.microsoft.com/v1/workspaces/$WORKSPACE_ID/git/updateFromGit" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
                "remoteCommitHash": "${{ env.TEST_COMMIT }}",
                "conflictResolution": {
                  "conflictResolutionType": "Workspace",
                  "conflictResolutionPolicy": "PreferWorkspace"
                },
                "options": {
                  "allowOverrideItems": true
                }
              }'
