name: Deploy Fabric to TEST

on:
  push:
    branches:
      - main # Si attiva quando il codice di DEV viene unito al ramo principale

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v3

      - name: Login su Azure via CLI
        run: az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }} --allow-no-subscriptions

      - name: Deploy su Fabric via REST API
        env:
          WORKSPACE_ID: "ca209b34-9112-4faf-a25e-3ccea1b76680" 
        run: |
          # 1. Recupera il token di accesso per Fabric
          TOKEN=$(az account get-access-token --resource "https://api.fabric.microsoft.com/" --query accessToken -o tsv)
          
          # 2. Invia il comando di sync al workspace di destinazione (TEST)
          # NOTA: Le Deployment Rules possono essere iniettate nel payload JSON per scambiare i GUID del Lakehouse
          curl -X POST "https://api.fabric.microsoft.com/v1/workspaces/$WORKSPACE_ID/git/updateFromGit" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
                "remoteCommitHash": "${{ github.sha }}",
                "conflictResolution": {
                  "conflictResolutionType": "Workspace",
                  "conflictResolutionPolicy": "PreferWorkspace"
                },
                "options": {
                  "allowOverrideItems": true
                }
              }'
