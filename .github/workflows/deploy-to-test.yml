name: Deploy Fabric to TEST

on:
  push:
    branches:
      - main

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sostituisci i GUID (Deployment Rules)
        run: |
          # 1. Regole per l'ambiente principale (PROVA_DEV -> PROVA_TEST)
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/9d151055-5883-45ed-970b-7b6628cf14ce/ca209b34-9112-4faf-a25e-3ccea1b76680/g' {} +
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/fccbab2d-4470-4913-bfe2-969b7c966c01/08c3e674-5bf6-4941-8a80-b4d3149230c2/g' {} +

          # 2. Regole per lo Shortcut nei metadati (TRIAL_DEV -> TRIAL_TEST)
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/cd5d7f99-489b-4961-8a9f-d87075d6ad29/886d3de4-c827-4caf-afc7-cccd4ebf35e7/g' {} +
          find . -type f -not -path '*/\.git/*' -not -path '*/\.github/*' -exec sed -i 's/6af8f567-bbcb-44cc-b60b-60408d28ae4c/df05b370-6550-427d-a3ae-494c614a0013/g' {} +

      - name: Crea e pusha il ramo di test (test-release)
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git checkout -b test-release
          git add .
          git commit -m "Auto-inject GUID per TEST" || echo "Nessuna modifica"
          git push -f origin test-release
          echo "TEST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Login su Azure via CLI
        run: az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }} --allow-no-subscriptions

      - name: Deploy codice via Fabric REST API
        env:
          WORKSPACE_ID: "ca209b34-9112-4faf-a25e-3ccea1b76680"
        run: |
          TOKEN=$(az account get-access-token --resource "https://api.fabric.microsoft.com/" --query accessToken -o tsv)
          echo "FABRIC_TOKEN=$TOKEN" >> $GITHUB_ENV

          curl -X POST "https://api.fabric.microsoft.com/v1/workspaces/$WORKSPACE_ID/git/updateFromGit" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
                "remoteCommitHash": "${{ env.TEST_COMMIT }}",
                "conflictResolution": {
                  "conflictResolutionType": "Workspace",
                  "conflictResolutionPolicy": "PreferRemote"
                },
                "options": {
                  "allowOverrideItems": true
                }
              }'

      - name: Sincronizza Shortcut OneLake via REST API
        env:
          TEST_WORKSPACE_ID: "ca209b34-9112-4faf-a25e-3ccea1b76680"
          TEST_LAKEHOUSE_ID: "08c3e674-5bf6-4941-8a80-b4d3149230c2"
          TRIAL_TEST_WORKSPACE_ID: "886d3de4-c827-4caf-afc7-cccd4ebf35e7"
          TRIAL_TEST_LAKEHOUSE_ID: "df05b370-6550-427d-a3ae-494c614a0013"
        run: |
          # Pausa di assestamento per il completamento del deployment Git
          sleep 5

          # 1. Elimina il vecchio puntamento dello shortcut (ignora l'esito se assente)
          curl -s -X DELETE "https://api.fabric.microsoft.com/v1/workspaces/$TEST_WORKSPACE_ID/items/$TEST_LAKEHOUSE_ID/shortcuts/Tables/dbo_1" \
            -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" || true

          # 2. Ricrea lo shortcut collegato al dominio TRIAL_TEST
          curl -s -X POST "https://api.fabric.microsoft.com/v1/workspaces/$TEST_WORKSPACE_ID/items/$TEST_LAKEHOUSE_ID/shortcuts" \
            -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "path": "Tables",
                  "name": "dbo_1",
                  "target": {
                    "oneLake": {
                      "workspaceId": "'"$TRIAL_TEST_WORKSPACE_ID"'",
                      "itemId": "'"$TRIAL_TEST_LAKEHOUSE_ID"'",
                      "path": "Tables/dbo"
                    }
                  }
                }'
